[project]
name = "inference-gateway"
version = "0.1.0"
description = "A provider-agnostic OpenAI-shape gateway with tiered routing, confidence escalation, semantic and exact caching, and a cost-per-1k-tokens ledger."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "llm-client-kit",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff==0.14.3"]

# Without a build backend the project is not installed into the venv, so
# `uvicorn inference_gateway.app:app` fails outside pytest -- which injects
# pythonpath itself and so hides the problem. The README's quickstart is a
# claim like any other and has to actually run.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inference_gateway"]

# The shared library is a sibling checkout, not a published package. A path
# source keeps the two repos developing together without a release cycle
# between them; CI checks out the workspace so the relative path resolves.
[tool.uv.sources]
llm-client-kit = { path = "../llm-client-kit", editable = true }

[tool.pytest.ini_options]
pythonpath = ["src", "../llm-client-kit/src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# B008 flags function calls in argument defaults, which is exactly how FastAPI
# declares dependency injection. Exempting the two DI markers by name keeps the
# rule active for every other call -- a blanket per-file ignore would switch the
# check off across the app module, where it is still worth having.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query"]
